<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Clientes | Terno Gabriel</title>
  <link rel="icon" th:href="@{/img/favicon.svg}" />
  <link rel="stylesheet" th:href="@{/css/global.css}" />
  <link rel="stylesheet" th:href="@{/css/empleado/clientes.css}" />
  <link rel="stylesheet" th:href="@{/css/responsive.css}" />
</head>

<body class="page-empleado-clientes">
  <div class="app-shell">
    <aside th:replace="~{fragments/sidebar-empleado :: sidebar('clientes')}"></aside>
    <main class="main">
      <header th:replace="~{fragments/mobile-header :: mobile-header}"></header>
      <div class="page-header">
        <div>
          <span class="frame-label">E-03</span>
          <h1>Clientes</h1>
          <p>Consulta y administración de clientes</p>
        </div>
        <div class="header-actions">
          <button class="icon-btn notification" data-action="notify" aria-label="Notificaciones" title="Notificaciones">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
              <path d="M10 21h4" />
            </svg><i></i>
          </button>
          <div class="date-block">
            <span>Hoy</span><strong data-current-date>-- --- ----</strong>
          </div>
        </div>
      </div>
      <div class="content" style="display: flex; flex-direction: column; gap: 24px">
        <!-- Contenedor de la Tabla -->
        <section class="card">
          <div class="card-head">
            <div>
              <h2>Registro de clientes</h2>
              <p>Consulta y administra los datos de los clientes</p>
            </div>
            <div class="filter-row">
              <input class="searchbox" data-table-search placeholder="Buscar por DNI o nombre" />
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>DNI</th>
                  <th>Nombre completo</th>
                  <th>Dirección</th>
                  <th>Teléfono</th>
                  <th>Correo</th>
                  <th>Última operación</th>
                  <th>Calificación</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <div th:replace="~{fragments/toast :: toast('Cambios guardados')}"></div>
  <script th:src="@{/js/api.js}" defer></script>
  <script th:src="@{/js/app.js}" defer></script>
  <script th:src="@{/js/empleado/clientes.js}" defer></script>
</body>

</html>
