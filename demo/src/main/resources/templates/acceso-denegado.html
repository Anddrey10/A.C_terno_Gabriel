<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Terno Gabriel | Acceso denegado</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" />
    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/login.css}" />
    <link rel="stylesheet" th:href="@{/css/responsive.css}" />
  </head>

  <body>
    <main class="login-page">
      <section class="login-brand">
        <div class="brand-mark large">TG</div>
        <div class="login-story">
          <span class="eyebrow light">GESTIÓN DE SASTRERÍA</span>
          <h1>Precisión en cada medida.<br />Control en cada proceso.</h1>
          <div class="gold-line"></div>
        </div>
        <span class="login-caption">Sistema interno · Trujillo, Perú</span>
      </section>

      <section class="login-panel">
        <div class="login-form">
          <div class="wordmark"><strong>Terno</strong> <em>Gabriel</em></div>

          <div class="login-title">
            <span class="eyebrow">ACCESO DENEGADO</span>
            <h2>No tienes permiso</h2>
            <p>Tu rol no permite entrar a esta pantalla.</p>
          </div>

          <a class="btn primary" th:href="@{/login}">
            Volver al inicio de sesión <span>›</span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
