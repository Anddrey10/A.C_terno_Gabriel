spring.application.name=demo

# Las credenciales NO se guardan en el repositorio: se leen de variables de entorno o del perfil "local"
# (archivo application-local.properties, ignorado por Git; ver application-local.properties.example).
spring.profiles.default=local
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:A.C_terno_gabriel}?sslMode=DISABLED&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Seguridad: no mostrar detalles internos de los errores al navegador
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.http-only=true

# Máximo de intentos de inicio de sesión fallidos por usuario y minutos de bloqueo
terno.seguridad.max-intentos=5
terno.seguridad.minutos-bloqueo=5

terno.reiniciar-datos=false
